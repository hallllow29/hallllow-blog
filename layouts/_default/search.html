{{- define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
</header>

{{- with .Content }}<div class="post-content">{{ . }}</div>{{ end }}

<input id="searchInput" type="search" autofocus autocomplete="off" spellcheck="false"
  aria-label="search" placeholder="{{ .Params.placeholder | default "search a technique…" }}"
  style="width:100%;box-sizing:border-box;padding:.6rem .8rem;font-size:1rem;border-radius:8px;border:1px solid var(--border);background:var(--entry);color:var(--primary);margin:.5rem 0 1rem;">

<div class="post-meta" style="margin-bottom:1.2rem;">
  Type a technique (e.g. <code>kerberoasting</code>, <code>adcs</code>, <code>gpo</code>, <code>dcsync</code>) — results jump straight to the exact section of the write-up.
</div>

<ul id="searchResults" style="list-style:none;margin:0;padding:0;"></ul>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js" crossorigin="anonymous"></script>
<script>
(function () {
  var resultsEl = document.getElementById("searchResults");
  var inputEl = document.getElementById("searchInput");
  var fuse = null;

  function chip(t) {
    return '<span style="font-size:.72rem;opacity:.8;border:1px solid var(--border);border-radius:6px;padding:.05rem .4rem;margin:0 .3rem .3rem 0;display:inline-block;">' + t + '</span>';
  }

  function render(list) {
    resultsEl.innerHTML = "";
    if (!list.length) {
      resultsEl.innerHTML = '<li class="post-meta" style="opacity:.6;">No matching section.</li>';
      return;
    }
    list.slice(0, 50).forEach(function (r) {
      var it = r.item || r;
      var chips = (it.categories || []).concat(it.tags || []).slice(0, 6).map(chip).join("");
      var li = document.createElement("li");
      li.style.cssText = "margin:0 0 .6rem;padding:.65rem .85rem;border:1px solid var(--border);border-radius:10px;background:var(--entry);";
      li.innerHTML =
        '<a href="' + it.url + '" style="font-weight:600;font-size:1.02rem;">' + it.section + "</a>" +
        '<div class="post-meta" style="font-size:.82rem;opacity:.7;margin:.15rem 0 .4rem;">' + it.post + "</div>" +
        '<div>' + chips + "</div>";
      resultsEl.appendChild(li);
    });
  }

  function run(q) {
    if (!fuse) return;
    q = (q || "").trim();
    if (q.length < 2) { resultsEl.innerHTML = ""; return; }
    render(fuse.search(q));
  }

  fetch("{{ "sectionindex.json" | relURL }}")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      fuse = new Fuse(data, {
        keys: [
          { name: "section", weight: 0.6 },
          { name: "tags", weight: 0.25 },
          { name: "post", weight: 0.1 },
          { name: "categories", weight: 0.05 }
        ],
        ignoreLocation: true,
        threshold: 0.4,
        minMatchCharLength: 2
      });
      var q = new URLSearchParams(window.location.search).get("q");
      if (q) { inputEl.value = q; run(q); }
    })
    .catch(function () {
      resultsEl.innerHTML = '<li class="post-meta" style="opacity:.6;">Search index not available (rebuild the site).</li>';
    });

  inputEl.addEventListener("input", function (e) {
    var q = e.target.value;
    run(q);
    var u = new URL(window.location);
    if (q.trim()) u.searchParams.set("q", q.trim()); else u.searchParams.delete("q");
    history.replaceState(null, "", u);
  });
})();
</script>
{{- end }}
