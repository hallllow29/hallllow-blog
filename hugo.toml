baseURL = "https://hallllow-blog.pages.dev/"
languageCode = "en-us"
title = "hallllow"
theme = "PaperMod"

[markup.goldmark.renderer]
  unsafe = true
  
[params]
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true

  # Home hero (rendered by layouts/index.html)
  author = "hallllow"
  roles = "red teamer · Active Directory enthusiast · security student"
  intro1 = "This is where I dump write-ups from the boxes and CTFs I play, the CVEs and bugs I run into, and notes from whatever rabbit hole I happen to be down."
  intro2 = "I'm firmly on the offensive side — red teaming and Active Directory are what I keep coming back to."
  ctaText = "View my write-ups"
  ctaURL = "posts"

  # profileMode is replaced by the custom home hero in layouts/index.html
  [params.profileMode]
    enabled = false
    title = "hallllow"
    subtitle = "CTF player · red team & AD enthusiast · security student"
    imageUrl = "images/logo.png"
    imageWidth = 160
    imageHeight = 160

    [[params.profileMode.buttons]]
      name = "whoami"
      url = "whoami"
    [[params.profileMode.buttons]]
      name = "research"
      url = "research"
    [[params.profileMode.buttons]]
      name = "write-ups"
      url = "posts"

    [[params.socialIcons]]
      name = "github"
      url = "https://github.com/hallllow29"

    [[params.socialIcons]]
      name = "linkedin"
      url = "https://www.linkedin.com/in/pedro-antunes-286165254/"

    

[[menu.main]]
  name = "whoami"
  url = "/whoami/"
  weight = 1
[[menu.main]]
  name = "write-ups"
  url = "/posts/"
  weight = 2
[[menu.main]]
  name = "research"
  url = "/research/"
  weight = 3

# archive + search pages still exist (/archive/, /search/) but are kept out of the top nav

# JSON output on the home page builds the Fuse.js index the search page uses
[outputs]
  home = ["HTML", "RSS", "JSON"]
